name: Diagnose promotion search

on:
  pull_request:
    branches: [experiment/budgeted-method-search]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.head_ref == 'experiment/targeted-ablation-search' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require complete D01-D03 blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/weon_eval/promotion_search.py")
          text = path.read_text()
          old = '''            combined_reserve = (
                method.base_method.generation_reserve_usd * 2
                + VLM_RESERVE_USD
                + (VLM_RESERVE_USD if method.mode == "best_of_two" else Decimal("0"))
            )
            for case in cases:
'''
          new = '''            combined_reserve = (
                method.base_method.generation_reserve_usd * 2
                + VLM_RESERVE_USD
                + (VLM_RESERVE_USD if method.mode == "best_of_two" else Decimal("0"))
            )
            full_case_reserve = combined_reserve * len(cases)
            full_case_requests = required_requests * len(cases)
            current = allowance_getter(api_key)
            if counter.count + full_case_requests > max_paid_requests:
                stop_reason = "request_cap"
                break
            if not can_spend(current, full_case_reserve, floor_usd):
                skips.append(
                    {
                        "method": method.name,
                        "replicate": replicate,
                        "reason": "full D01-D03 reserve would cross floor",
                        "remaining_usd": str(current.remaining_usd),
                        "full_case_reserve_usd": str(full_case_reserve),
                    }
                )
                continue
            for case in cases:
'''
          if old not in text:
              raise SystemExit("promotion reserve block not found")
          text = text.replace(old, new)
          old_end = '''        if successful_this_round == 0:
            stop_reason = "floor_guard" if attempted_this_round == 0 else "no_successful_candidates"
            break
'''
          new_end = '''        if successful_this_round == 0:
            if stop_reason != "request_cap":
                stop_reason = (
                    "floor_guard" if attempted_this_round == 0 else "no_successful_candidates"
                )
            break
'''
          if old_end not in text:
              raise SystemExit("promotion stop block not found")
          path.write_text(text.replace(old_end, new_end))

          test_path = Path("tests/test_promotion_search.py")
          tests = test_path.read_text()
          tests = tests.replace('remaining = Decimal("0.80")', 'remaining = Decimal("0.95")')
          tests = tests.replace(
              'assert remaining == Decimal("0.554")',
              'assert remaining == Decimal("0.704")',
          )
          test_path.write_text(tests)
          PY
          rm -f .github/workflows/diagnose-promotion.yml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check . --fix
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - name: Commit verified fairness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require complete promotion case blocks" -m "Reserve a full D01-D03 block before starting each promoted method so the floor cannot leave a method evaluated on a partial case set. Validate all tests and remove temporary diagnostics."
          git push origin HEAD:${{ github.head_ref }}

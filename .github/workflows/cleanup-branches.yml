name: Cleanup remote branches

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "weon-branch-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def branches():
              names = []
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}"
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                      batch = json.load(response)
                  if not batch:
                      return names
                  names.extend(item["name"] for item in batch)
                  page += 1

          before = branches()
          failures = []
          for name in before:
              if name == "main":
                  continue
              encoded = urllib.parse.quote(name, safe="")
              url = f"https://api.github.com/repos/{repo}/git/refs/heads/{encoded}"
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers, method="DELETE")
                  ) as response:
                      if response.status != 204:
                          failures.append(f"{name}: HTTP {response.status}")
              except Exception as error:
                  failures.append(f"{name}: {error}")

          after = branches()
          if failures:
              raise SystemExit("Failed deletions:\n" + "\n".join(failures))
          if after != ["main"]:
              raise SystemExit(f"Unexpected remaining branches: {after}")

          payload = json.dumps(
              {"before": before, "after": after, "deleted_count": len(before) - 1},
              indent=2,
              sort_keys=True,
          ) + "\n"
          data = json.dumps({
              "message": "chore: record branch cleanup verification",
              "content": base64.b64encode(payload.encode()).decode(),
              "branch": "main",
          }).encode()
          url = f"https://api.github.com/repos/{repo}/contents/.branch-cleanup-result.json"
          request = urllib.request.Request(url, data=data, headers=headers, method="PUT")
          with urllib.request.urlopen(request) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"Could not record cleanup result: HTTP {response.status}")
          PY

name: Run development matrix

on:
  workflow_dispatch:
    inputs:
      generator_model:
        description: OpenRouter image model slug
        required: true
        type: string
        default: google/gemini-3.1-flash-lite-image
      evaluator_model:
        description: OpenRouter vision evaluator model slug
        required: true
        type: string
        default: google/gemini-2.5-flash-lite
      confirm_paid_run:
        description: Confirm nine image requests and six VLM requests
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      generator_model:
        required: true
        type: string
      evaluator_model:
        required: true
        type: string
      confirm_paid_run:
        required: true
        type: boolean
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: paid-development-matrix
  cancel-in-progress: false

jobs:
  run:
    if: ${{ inputs.confirm_paid_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GENERATOR_MODEL: ${{ inputs.generator_model }}
      EVALUATOR_MODEL: ${{ inputs.evaluator_model }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Guard paid run
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "OPENROUTER_API_KEY is not configured" >&2
            exit 2
          fi
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - name: Prepare development inputs
        run: |
          set -euo pipefail
          for case_id in D01 D02 D03; do
            uv run weon-prepare-inputs "$case_id"
          done
      - name: Run paid development matrix
        run: |
          uv run weon-development \
            --generator-model "$GENERATOR_MODEL" \
            --evaluator-model "$EVALUATOR_MODEL"
      - name: Publish summary
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("outputs/development/development_summary.json").read_text())
          lines = [
              "## Development experiment",
              f"- Generator: `{summary['generator_model']}`",
              f"- Evaluator: `{summary['evaluator_model']}`",
              f"- Image requests: `{summary['image_requests']}`",
              f"- VLM requests: `{summary['vlm_requests']}`",
              f"- Holdout calls: `{summary['holdout_calls']}`",
              f"- Automatic winner: `{summary['auto_winner']}`",
              f"- Winner status: `{summary['winner_status']}`",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-matrix-${{ github.run_id }}
          path: outputs/development/
          if-no-files-found: warn
          retention-days: 14

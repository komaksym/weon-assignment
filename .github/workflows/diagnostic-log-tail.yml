name: Diagnostic log tail

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: read
  contents: read

jobs:
  capture:
    if: >-
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.ref == 'diagnostics/nano-banana-lite-d01'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/jobs/89473739077/logs \
            -o job.log
          tail -n 60 job.log > diagnostic-tail.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nano-banana-lite-error-tail
          path: diagnostic-tail.txt
          retention-days: 1

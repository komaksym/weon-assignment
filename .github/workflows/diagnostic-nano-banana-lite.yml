name: Diagnostic Nano Banana Lite

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  run:
    if: >-
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostics/nano-banana-lite-d01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Guard secret
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo "OPENROUTER_API_KEY is not configured" >&2; exit 2; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare compact references
        run: |
          set -euo pipefail
          mkdir -p diagnostic-input diagnostic-output
          python -m pip install --quiet pillow
          curl --silent --show-error --fail --location \
            https://cdn-dev.weon.ai/i/generated/0c64b33b-b375-4b4d-b911-cb808dd03114.png \
            -o diagnostic-input/person-original.png
          curl --silent --show-error --fail --location \
            https://cdn-dev.weon.ai/i/generated/a81130b2-5f65-4157-aa8e-3cfca488b01d.png \
            -o diagnostic-input/environment-original.png
          curl --silent --show-error --fail --location \
            https://storage.googleapis.com/weon-general-electric-icon-486910-f1/zcq/temp/case1_lower.jpg \
            -o diagnostic-input/garment-original.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          records = []
          for role in ("person", "environment", "garment"):
              source = Path(f"diagnostic-input/{role}-original.png")
              target = Path(f"diagnostic-input/{role}.jpg")
              with Image.open(source) as image:
                  original_size = image.size
                  image.thumbnail((1024, 1024))
                  if image.mode != "RGB":
                      background = Image.new("RGB", image.size, "white")
                      if "A" in image.getbands():
                          background.paste(image, mask=image.getchannel("A"))
                      else:
                          background.paste(image)
                      image = background
                  image.save(target, "JPEG", quality=85, optimize=True)
                  records.append({
                      "role": role,
                      "original_dimensions": original_size,
                      "resized_dimensions": image.size,
                      "bytes": target.stat().st_size,
                  })
          Path("diagnostic-output/input-sizes.json").write_text(json.dumps(records, indent=2))
          PY
      - name: Build request payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          prompt = """Create a realistic fashion photoshoot using the supplied references in this order:
          1. the person/model image,
          2. the environment image,
          3. the garment packshot image(s).

          Dress the person in every supplied garment and place them naturally in the supplied environment.
          Preserve the garment's visible color, print or logo, material, shape, length, seams, closures, and other distinctive details. Do not invent branding or redesign the garment.

          Garment 1: shorts.png"""

          def data_url(path: str) -> str:
              encoded = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              return f"data:image/jpeg;base64,{encoded}"

          payload = {
              "model": "google/gemini-3.1-flash-lite-image",
              "messages": [{
                  "role": "user",
                  "content": [
                      {"type": "text", "text": prompt},
                      {"type": "image_url", "image_url": {"url": data_url("diagnostic-input/person.jpg")}},
                      {"type": "image_url", "image_url": {"url": data_url("diagnostic-input/environment.jpg")}},
                      {"type": "image_url", "image_url": {"url": data_url("diagnostic-input/garment.jpg")}},
                  ],
              }],
              "modalities": ["image", "text"],
          }
          Path("request.json").write_text(json.dumps(payload))
          PY
      - name: Run one lightweight image request
        run: |
          set -uo pipefail
          started=$(date +%s%3N)
          curl_exit=0
          status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            -o response.json \
            -w '%{http_code}' \
            https://openrouter.ai/api/v1/chat/completions) || curl_exit=$?
          ended=$(date +%s%3N)
          latency_ms=$((ended - started))

          CURL_EXIT="$curl_exit" HTTP_STATUS="$status" LATENCY_MS="$latency_ms" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          output = Path("diagnostic-output")
          curl_exit = int(os.environ["CURL_EXIT"])
          status_text = os.environ.get("HTTP_STATUS") or "0"
          status = int(status_text)
          latency_ms = int(os.environ["LATENCY_MS"])

          if curl_exit != 0:
              error = {"curl_exit": curl_exit, "http_status": status, "latency_ms": latency_ms}
              (output / "error.json").write_text(json.dumps(error, indent=2))
              raise SystemExit(f"curl failed with exit {curl_exit}")

          body = json.loads(Path("response.json").read_text())
          if not 200 <= status < 300:
              message = body.get("error", {}).get("message", "unknown OpenRouter error")
              error = {"http_status": status, "latency_ms": latency_ms, "error": message}
              (output / "error.json").write_text(json.dumps(error, indent=2))
              raise SystemExit(message)

          message = body.get("choices", [{}])[0].get("message", {})
          images = message.get("images") or []
          if not images:
              record = {
                  "latency_ms": latency_ms,
                  "model": body.get("model"),
                  "usage": body.get("usage"),
                  "message": message,
              }
              (output / "no-image-response.json").write_text(json.dumps(record, indent=2))
              raise SystemExit("OpenRouter returned no image")

          data_url = images[0]["image_url"]["url"]
          header, encoded = data_url.split(",", 1)
          media_type = header.removeprefix("data:").split(";", 1)[0]
          suffix = {"image/png": ".png", "image/jpeg": ".jpg", "image/webp": ".webp"}.get(media_type, ".bin")
          (output / f"image{suffix}").write_bytes(base64.b64decode(encoded))

          metadata = {
              "model": body.get("model", "google/gemini-3.1-flash-lite-image"),
              "latency_ms": latency_ms,
              "media_type": media_type,
              "text": message.get("content") or "",
              "usage": body.get("usage"),
          }
          (output / "metadata.json").write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nano-banana-lite-d01-${{ github.run_id }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 2

name: Diagnose budget search

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'experiment/budgeted-method-search' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Capture diagnostics
        run: |
          set +e
          mkdir -p diagnostics
          uv run ruff check . > diagnostics/ruff.txt 2>&1
          echo $? > diagnostics/ruff-status.txt
          uv run mypy src > diagnostics/mypy.txt 2>&1
          echo $? > diagnostics/mypy-status.txt
          uv run pytest > diagnostics/pytest.txt 2>&1
          echo $? > diagnostics/pytest-status.txt
          uv build > diagnostics/build.txt 2>&1
          echo $? > diagnostics/build-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: budget-search-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 1

name: Diagnose provenance script once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.head_ref == 'fix/clarify-ai-visual-assessment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clarify-ai-visual-assessment
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture exact patch error
        run: |
          set +e
          python scripts/apply_review_provenance_fix.py > /tmp/provenance.log 2>&1
          status=$?
          git reset --hard HEAD
          tail -80 /tmp/provenance.log > PATCH_ERROR.txt
          printf '\nexit_status=%s\n' "$status" >> PATCH_ERROR.txt
          rm .github/workflows/diagnose-provenance-script-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PATCH_ERROR.txt .github/workflows/diagnose-provenance-script-once.yml
          git commit -m "chore: capture provenance patch failure"
          git push origin HEAD:fix/clarify-ai-visual-assessment

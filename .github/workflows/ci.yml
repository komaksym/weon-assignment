name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.head_ref == 'experiment/targeted-ablation-search' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply validated RGB pixel patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/weon_eval/search_methods.py")
          text = path.read_text()
          old = '''def _background_color(image: Image.Image) -> tuple[int, int, int]:
    corners = (
        image.getpixel((0, 0)),
        image.getpixel((image.width - 1, 0)),
        image.getpixel((0, image.height - 1)),
        image.getpixel((image.width - 1, image.height - 1)),
    )
    average = tuple(
        round(sum(pixel[channel] for pixel in corners) / len(corners))
        for channel in range(3)
    )
    return cast(tuple[int, int, int], average)


def _foreground_mask(image: Image.Image, threshold: int = 42) -> Image.Image:
    background = _background_color(image)
    threshold_squared = threshold * threshold
    mask = Image.new("L", image.size)
    values = []
    for red, green, blue in image.getdata():
        distance = (
            (red - background[0]) ** 2
            + (green - background[1]) ** 2
            + (blue - background[2]) ** 2
        )
        values.append(255 if distance > threshold_squared else 0)
    mask.putdata(values)
    return mask
'''
          new = '''def _pixel(image: Image.Image, x: int, y: int) -> tuple[int, int, int]:
    value = image.getpixel((x, y))
    if not isinstance(value, tuple) or len(value) < 3:
        raise ValueError("expected an RGB image")
    channels = value[:3]
    if not all(isinstance(channel, int) for channel in channels):
        raise ValueError("expected integer RGB channels")
    return cast(tuple[int, int, int], channels)


def _background_color(image: Image.Image) -> tuple[int, int, int]:
    corners = (
        _pixel(image, 0, 0),
        _pixel(image, image.width - 1, 0),
        _pixel(image, 0, image.height - 1),
        _pixel(image, image.width - 1, image.height - 1),
    )
    average = tuple(
        round(sum(pixel[channel] for pixel in corners) / len(corners))
        for channel in range(3)
    )
    return cast(tuple[int, int, int], average)


def _foreground_mask(image: Image.Image, threshold: int = 42) -> Image.Image:
    background = _background_color(image)
    threshold_squared = threshold * threshold
    mask = Image.new("L", image.size)
    values: list[int] = []
    for y in range(image.height):
        for x in range(image.width):
            red, green, blue = _pixel(image, x, y)
            distance = (
                (red - background[0]) ** 2
                + (green - background[1]) ** 2
                + (blue - background[2]) ** 2
            )
            values.append(255 if distance > threshold_squared else 0)
    mask.putdata(values)
    return mask
'''
          if old not in text:
              raise SystemExit("expected pixel block not found")
          path.write_text(text.replace(old, new))
          PY
          git fetch origin experiment/budgeted-method-search --depth=1
          git show origin/experiment/budgeted-method-search:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/diagnose-targeted.yml
          rm -f .github/workflows/fix-targeted-pixel-types.yml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - name: Commit clean validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate RGB pixel access" -m "Use runtime-validated RGB access for deterministic preprocessing, satisfy strict Pillow typing, restore normal CI, and remove temporary helpers."
          git push origin HEAD:${{ github.head_ref }}

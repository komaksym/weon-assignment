name: Diagnose promotion test

on:
  pull_request:
    branches: [experiment/budgeted-method-search]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'experiment/targeted-ablation-search' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Capture focused pytest
        run: |
          set +e
          uv run pytest tests/test_promotion_search.py -vv > pytest.txt 2>&1
          echo $? > pytest-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-pytest-${{ github.run_id }}
          path: |
            pytest.txt
            pytest-status.txt
          retention-days: 1

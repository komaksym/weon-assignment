name: Execute development matrix once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  execute:
    if: ${{ github.head_ref == 'execute/slice-3-development-matrix' && github.run_attempt == 1 }}
    uses: ./.github/workflows/run-development.yml
    with:
      generator_model: google/gemini-3.1-flash-lite-image
      evaluator_model: google/gemini-2.5-flash-lite
      confirm_paid_run: true
    secrets: inherit

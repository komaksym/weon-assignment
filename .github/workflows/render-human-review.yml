name: Finalize human-review evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-human-review.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Finalize documentation and remove temporary helpers
        run: |
          uv run python scripts/finalize_human_review_docs.py
          rm scripts/render_human_review_sheets.py
          rm scripts/finalize_human_review_docs.py
          rm .github/workflows/render-human-review.yml

      - name: Verify permanent review evidence
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'D01-human-review.png': (4200, 2400),
              'D02-human-review.png': (4200, 2400),
              'D03-human-review.png': (4200, 2400),
              'H01-human-review.png': (3100, 2250),
              'H02-human-review.png': (3100, 2250),
          }
          for name, size in expected.items():
              path = Path('submission/review') / name
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'{name}: expected {size}, got {image.size}')
          if not Path('submission/HUMAN_REVIEW.md').exists():
              raise SystemExit('Missing human-review protocol')
          PY
          git diff --check

      - name: Run repository validation
        run: |
          uv run ruff check .
          uv run mypy src
          uv run pytest
          uv build

      - name: Commit permanent review evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit \
            -m 'docs: finalize high-resolution human-review evidence' \
            -m 'Link the D01-D03 and H01-H02 review sheets from README, REPORT, and PLANS; preserve the pending author-rating protocol; verify the full repository; and remove all temporary rendering helpers.'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

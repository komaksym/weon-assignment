name: Fix provenance script once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'fix/clarify-ai-visual-assessment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clarify-ai-visual-assessment
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove self-conflicting assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_review_provenance_fix.py')
          text = path.read_text()
          text = text.replace(
              '        ("| Manual mean |", "| ChatGPT visual-assessment mean |"),\n',
              '',
          )
          text = text.replace(
              '    "manual_scores.csv",\n',
              '',
          )
          path.write_text(text)
          PY
          rm .github/workflows/fix-provenance-script-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: fix provenance patch assertions"
          git push origin HEAD:fix/clarify-ai-visual-assessment

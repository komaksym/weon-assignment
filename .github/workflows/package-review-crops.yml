name: Package review crops once

on:
  pull_request:
    branches:
      - feature/slice-4-holdout-submission

permissions:
  actions: read
  contents: write

jobs:
  package:
    if: ${{ github.head_ref == 'fix/pr17-review-findings' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr17-review-findings
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Download existing frozen artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/holdout
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8604496953/zip" > /tmp/holdout.zip
          unzip -q /tmp/holdout.zip -d /tmp/holdout
      - name: Build crop-enhanced durable figures
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          artifact = Path('/tmp/holdout')
          output = Path('submission/figures')
          boxes = {
              'H01': (0.23, 0.77, 0.78, 0.99),
              'H02': (0.29, 0.39, 0.71, 0.69),
          }
          for case_id, normalized in boxes.items():
              with Image.open(artifact / case_id / 'contact_sheet.jpg') as source:
                  original = source.convert('RGB')
              with Image.open(
                  artifact
                  / case_id
                  / 'google_gemini-3.1-flash-lite-image'
                  / 'baseline'
                  / 'image.jpg'
              ) as source:
                  result = source.convert('RGB')
              width, height = result.size
              left, top, right, bottom = normalized
              pixel_box = (
                  round(left * width),
                  round(top * height),
                  round(right * width),
                  round(bottom * height),
              )
              crop = result.crop(pixel_box)
              panel_size = (420, 540)
              contained = ImageOps.contain(crop, panel_size, Image.Resampling.LANCZOS)
              panel = Image.new('RGB', panel_size, 'white')
              offset = (
                  (panel_size[0] - contained.width) // 2,
                  (panel_size[1] - contained.height) // 2,
              )
              panel.paste(contained, offset)
              sheet = Image.new('RGB', (1260, 582), 'white')
              sheet.paste(original, (0, 0))
              sheet.paste(panel, (840, 0))
              ImageDraw.Draw(sheet).text((850, 552), 'result detail crop', fill='black')
              sheet.save(
                  output / f'{case_id}-contact-sheet.jpg',
                  format='JPEG',
                  quality=88,
                  optimize=True,
                  progressive=True,
              )
          PY
      - name: Commit durable figures
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add submission/figures/H01-contact-sheet.jpg submission/figures/H02-contact-sheet.jpg
          git commit -m "docs: add auditable holdout detail crops" -m "Preserve full-body context while adding deterministic garment-region zoom panels derived from the existing frozen outputs; no model call, regeneration, or score change is involved."
          git push origin HEAD:fix/pr17-review-findings
